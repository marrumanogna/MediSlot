AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot IAM deployment permissions for GitHub Actions,
  including EC2 networking, RDS subnet groups, DynamoDB,
  and the regional API Gateway CloudWatch logging role.
  Lambda execution roles remain managed by auth-stack.yaml.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod

  GitHubActionsRoleName:
    Type: String
    Default: MediSlotGitHubActionsRole

Resources:
  MediSlotGitHubActionsDeploymentPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub MediSlot-${Environment}-GitHubActionsDeploymentPolicy
      Roles:
        - !Ref GitHubActionsRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ManageMediSlotChangeSets
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-iam/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-network/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-data/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-auth/*

          - Sid: InspectCloudFormation
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
              - cloudformation:DescribeStackResources
            Resource: "*"

          - Sid: ManageMediSlotNetworkResources
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:DescribeVpcs
              - ec2:DescribeVpcAttribute
              - ec2:ModifyVpcAttribute
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:DescribeInternetGateways
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:DescribeSubnets
              - ec2:ModifySubnetAttribute
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:DescribeRouteTables
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:DescribeSecurityGroups
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:CreateVpcEndpoint
              - ec2:DeleteVpcEndpoints
              - ec2:DescribeVpcEndpoints
              - ec2:DescribeVpcEndpointServices
              - ec2:DescribeAvailabilityZones
              - ec2:DescribePrefixLists
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DescribeTags
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

          - Sid: ManageMediSlotRDSSubnetGroups
            Effect: Allow
            Action:
              - rds:CreateDBSubnetGroup
              - rds:DescribeDBSubnetGroups
              - rds:ModifyDBSubnetGroup
              - rds:DeleteDBSubnetGroup
              - rds:AddTagsToResource
              - rds:RemoveTagsFromResource
              - rds:ListTagsForResource
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:medislot-${Environment}-data-*

          - Sid: ManageMediSlotAuthTokensTable
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:DeleteTable
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:ListTagsOfResource
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-AuthTokens

          - Sid: ConfigureApiGatewayCloudWatchAccount
            Effect: Allow
            Action:
              - apigateway:PATCH
              - apigateway:GET
            Resource:
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/account

          - Sid: ManageApiGatewayCloudWatchRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:TagRole
              - iam:UntagRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:PassRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/MediSlotApiGatewayCloudWatchRole

          - Sid: ManageMediSlotSSMParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:PutParameter
              - ssm:DeleteParameter
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/*
          - Sid: ManageMediSlotDynamoDBTables
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:DeleteTable
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:ListTagsOfResource
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-*
          - Sid: ReadCallerIdentity
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: "*"

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    DependsOn:
      - MediSlotGitHubActionsDeploymentPolicy
    Properties:
      RoleName: MediSlotApiGatewayCloudWatchRole
      Description: Allows API Gateway to publish execution logs to CloudWatch.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
      Tags:
        - Key: Project
          Value: MediSlot

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    DependsOn:
      - MediSlotGitHubActionsDeploymentPolicy
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

Outputs:
  DeploymentRoleName:
    Description: GitHub Actions deployment role receiving the policy.
    Value: !Ref GitHubActionsRoleName

  DeploymentPolicyName:
    Description: Name of the attached deployment policy.
    Value: !Ref MediSlotGitHubActionsDeploymentPolicy

  ApiGatewayCloudWatchRoleArn:
    Description: Regional API Gateway CloudWatch logging role.
    Value: !GetAtt ApiGatewayCloudWatchRole.Arn