AWSTemplateFormatVersion: "2010-09-09"

Description: >
  MediSlot IAM deployment permissions for GitHub Actions,
  including EC2 networking, S3 buckets, RDS database instances
  and subnet groups, DynamoDB, SSM parameters, and API Gateway
  CloudWatch logging. Lambda execution roles remain managed
  by auth-stack.yaml.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod

  GitHubActionsRoleName:
    Type: String
    Default: MediSlotGitHubActionsRole

Resources:
  MediSlotGitHubActionsDeploymentPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub MediSlot-${Environment}-GitHubActionsDeploymentPolicy
      Roles:
        - !Ref GitHubActionsRoleName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:

          # CloudFormation deployment and recovery
          - Sid: ManageMediSlotChangeSets
            Effect: Allow
            Action:
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-iam/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-network/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-data/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/medislot-${Environment}-auth/*

          - Sid: InspectCloudFormation
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
              - cloudformation:DescribeStackResources
            Resource: "*"

          # VPC, subnets, route tables, security groups and endpoints
          - Sid: ManageMediSlotNetworkResources
            Effect: Allow
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:DescribeVpcs
              - ec2:DescribeVpcAttribute
              - ec2:ModifyVpcAttribute
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:DescribeInternetGateways
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:DescribeSubnets
              - ec2:ModifySubnetAttribute
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:DescribeRouteTables
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:AssociateRouteTable
              - ec2:DisassociateRouteTable
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:DescribeSecurityGroups
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:RevokeSecurityGroupIngress
              - ec2:CreateVpcEndpoint
              - ec2:DeleteVpcEndpoints
              - ec2:DescribeVpcEndpoints
              - ec2:DescribeVpcEndpointServices
              - ec2:DescribeAvailabilityZones
              - ec2:DescribePrefixLists
              - ec2:CreateTags
              - ec2:DeleteTags
              - ec2:DescribeTags
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

          # S3 bucket management
          - Sid: ManageMediSlotS3Buckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:GetBucketLocation
              - s3:ListBucket
              - s3:GetBucketTagging
              - s3:PutBucketTagging
              - s3:GetEncryptionConfiguration
              - s3:PutEncryptionConfiguration
              - s3:GetBucketPublicAccessBlock
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketVersioning
              - s3:PutBucketVersioning
              - s3:GetBucketPolicy
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:GetBucketOwnershipControls
              - s3:PutBucketOwnershipControls
              - s3:GetLifecycleConfiguration
              - s3:PutLifecycleConfiguration
              - s3:GetBucketCORS
              - s3:PutBucketCORS
              - s3:GetBucketLogging
              - s3:PutBucketLogging
              - s3:GetBucketNotification
              - s3:PutBucketNotification
              - s3:GetBucketWebsite
              - s3:PutBucketWebsite
              - s3:GetBucketAcl
              - s3:PutBucketAcl
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-*

          # Objects in MediSlot buckets
          - Sid: ManageMediSlotS3Objects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
              - s3:ListMultipartUploadParts
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::medislot-${Environment}-*/*

          # RDS subnet groups
          - Sid: ManageMediSlotRDSSubnetGroups
            Effect: Allow
            Action:
              - rds:CreateDBSubnetGroup
              - rds:DescribeDBSubnetGroups
              - rds:ModifyDBSubnetGroup
              - rds:DeleteDBSubnetGroup
              - rds:AddTagsToResource
              - rds:RemoveTagsFromResource
              - rds:ListTagsForResource
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:medislot-${Environment}-data-*

          # RDS instance creation, restricted to the deployment region
          - Sid: CreateMediSlotRDSInstances
            Effect: Allow
            Action:
              - rds:CreateDBInstance
            Resource: "*"
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region

          # RDS instance descriptions and lifecycle management
          - Sid: ManageMediSlotRDSInstances
            Effect: Allow
            Action:
              - rds:DescribeDBInstances
              - rds:ModifyDBInstance
              - rds:DeleteDBInstance
              - rds:AddTagsToResource
              - rds:RemoveTagsFromResource
              - rds:ListTagsForResource
            Resource:
              - !Sub arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:medislot-${Environment}-*

          # Allow RDS to create its service-linked role
          - Sid: CreateRDSServiceLinkedRole
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/rds.amazonaws.com/AWSServiceRoleForRDS
            Condition:
              StringLike:
                iam:AWSServiceName: rds.amazonaws.com

          # DynamoDB tables
          - Sid: ManageMediSlotDynamoDBTables
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:DeleteTable
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:ListTagsOfResource
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-*

          # SSM application and database parameters
          - Sid: ManageMediSlotSSMParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:PutParameter
              - ssm:DeleteParameter
            Resource:
              - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/*

          # Regional API Gateway CloudWatch configuration
          - Sid: ConfigureApiGatewayCloudWatchAccount
            Effect: Allow
            Action:
              - apigateway:PATCH
              - apigateway:GET
            Resource:
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/account

          # API Gateway CloudWatch logging role
          - Sid: ManageApiGatewayCloudWatchRole
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:TagRole
              - iam:UntagRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:UpdateAssumeRolePolicy
              - iam:PassRole
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/MediSlotApiGatewayCloudWatchRole

          - Sid: ReadCallerIdentity
            Effect: Allow
            Action:
              - sts:GetCallerIdentity
            Resource: "*"

  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    DependsOn:
      - MediSlotGitHubActionsDeploymentPolicy
    Properties:
      RoleName: MediSlotApiGatewayCloudWatchRole
      Description: Allows API Gateway to publish execution logs to CloudWatch.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
      Tags:
        - Key: Project
          Value: MediSlot

  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    DependsOn:
      - MediSlotGitHubActionsDeploymentPolicy
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

Outputs:
  DeploymentRoleName:
    Description: GitHub Actions deployment role receiving the policy.
    Value: !Ref GitHubActionsRoleName

  DeploymentPolicyName:
    Description: Name of the attached deployment policy.
    Value: !Ref MediSlotGitHubActionsDeploymentPolicy

  ApiGatewayCloudWatchRoleArn:
    Description: Regional API Gateway CloudWatch logging role.
    Value: !GetAtt ApiGatewayCloudWatchRole.Arn