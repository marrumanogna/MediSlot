AWSTemplateFormatVersion: '2010-09-09'
Description: MediSlot custom authentication API, JWT authorizer, least-privilege per-function roles.
Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  ArtifactBucket: {Type: String}
  ArtifactPrefix: {Type: String}
  DoctorPhotosBucketName: {Type: String}

Resources:
  LambdaExecutionBasePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'MediSlot-${Environment}-LambdaBasePolicy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [logs:CreateLogGroup]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-*'
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/medislot-${Environment}-*:*'
          - Effect: Allow
            Action: [ec2:CreateNetworkInterface, ec2:DescribeNetworkInterfaces, ec2:DeleteNetworkInterface, ec2:AssignPrivateIpAddresses, ec2:UnassignPrivateIpAddresses]
            Resource: '*'
            
  RegisterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-RegisterRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: RegisterRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/*'}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}

  DoctorRegisterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-DoctorRegisterRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: DoctorRegisterRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/*'}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}
  LoginRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-LoginRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: LoginRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/*'}
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:PutItem], Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-AuthTokens'}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}
  RefreshRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-RefreshRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: RefreshRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/*'}
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem], Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-AuthTokens'}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}
  LogoutRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-LogoutRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: LogoutRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/*'}
              - {Effect: Allow, Action: [dynamodb:PutItem, dynamodb:UpdateItem], Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-AuthTokens'}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}
  AuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-AuthorizerRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: AuthorizerRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/jwt-secret'}
              - {Effect: Allow, Action: [dynamodb:GetItem], Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/MediSlot-${Environment}-AuthTokens'}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}

  RegisterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-register'
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt RegisterRole.Arn
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/register.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment, ROLE: PATIENT}}
      
  DoctorRegisterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-register-doctor'
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt DoctorRegisterRole.Arn
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/register.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment, ROLE: DOCTOR}}
  LoginFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-login'
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt LoginRole.Arn
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/login.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
  RefreshFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-refresh'
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt RefreshRole.Arn
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/refresh.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
  LogoutFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-logout'
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt LogoutRole.Arn
      Timeout: 15
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/logout.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-authorizer'
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt AuthorizerRole.Arn
      Timeout: 10
      MemorySize: 256
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/authorizer.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
  DoctorProfileRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-DoctorProfileRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref LambdaExecutionBasePolicy
      Policies:
        - PolicyName: DoctorProfileRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/*'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/jwt-secret'

              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'

              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${DoctorPhotosBucketName}/doctors/*'
  RdsCheckRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-RdsCheckRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
      Policies:
        - PolicyName: RdsCheckRuntimeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ssm:GetParameter], Resource: [!Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/db/*', !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/medislot/${Environment}/auth/jwt-secret']}
              - {Effect: Allow, Action: [kms:Decrypt], Resource: '*'}
  RdsConnectionCheckFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-rds-connection-check'
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt RdsCheckRole.Arn
      Timeout: 10
      MemorySize: 128
      Code: {S3Bucket: !Ref ArtifactBucket, S3Key: !Sub '${ArtifactPrefix}/rds_check.zip'}
      VpcConfig:
        SecurityGroupIds: [!ImportValue {Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'}]
        SubnetIds:
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment: {Variables: {ENVIRONMENT: !Ref Environment}}
  DoctorProfileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-doctor-profile'
      Runtime: python3.12
      Handler: lambda_function.handler
      Role: !GetAtt DoctorProfileRole.Arn
      Timeout: 15
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub '${ArtifactPrefix}/doctor_profile.zip'
      VpcConfig:
        SecurityGroupIds:
          - !ImportValue
              Fn::Sub: 'MediSlot-${Environment}-LambdaSecurityGroupId'
        SubnetIds:
          - !ImportValue
              Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet1Id'
          - !ImportValue
              Fn::Sub: 'MediSlot-${Environment}-PrivateSubnet2Id'
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          DOCTOR_PHOTOS_BUCKET: !Ref DoctorPhotosBucketName
  ProtectedFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'MediSlot-${Environment}-ProtectedTestRole'
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [!Ref LambdaExecutionBasePolicy]
  ProtectedFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'medislot-${Environment}-protected-test'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ProtectedFunctionRole.Arn
      Timeout: 5
      Code:
        ZipFile: |
          import json
          def handler(event, context):
              ctx = event.get("requestContext", {}).get("authorizer", {})
              return {"statusCode": 200, "headers": {"content-type":"application/json"},
                      "body": json.dumps({"message":"Role-authorized test endpoint",
                                           "userId":ctx.get("userId"),"role":ctx.get("role")})}
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'medislot-${Environment}-api'
      EndpointConfiguration: {Types: [REGIONAL]}
  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub 'medislot-${Environment}-jwt-authorizer'
      RestApiId: !Ref RestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 0
      AuthorizerUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations'
  AuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AuthorizerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/authorizers/${ApiAuthorizer}'
  PatientResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !GetAtt RestApi.RootResourceId, PathPart: patient}
  DoctorResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !GetAtt RestApi.RootResourceId, PathPart: doctor}
  DoctorProfileResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorResource
      PathPart: profile
  PatientProtectedMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PatientResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProtectedFunction.Arn}/invocations'}
  DoctorProtectedMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProtectedFunction.Arn}/invocations'}
  DoctorProfileGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorProfileResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorProfileFunction.Arn}/invocations'

  DoctorProfilePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorProfileResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorProfileFunction.Arn}/invocations'

  DoctorProfilePutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorProfileResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorProfileFunction.Arn}/invocations'

  DoctorProfilePatchMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorProfileResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorProfileFunction.Arn}/invocations'
  DoctorProfileDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorProfileResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorProfileFunction.Arn}/invocations'
  DoctorProfilePhotoUploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref DoctorProfileResource
      PathPart: photo-upload-url

  DoctorProfilePhotoUploadMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorProfilePhotoUploadResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorProfileFunction.Arn}/invocations'
  PatientRegisterResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !GetAtt RestApi.RootResourceId, PathPart: auth}
  PatientRegisterRoute:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref PatientRegisterResource, PathPart: register}
  PatientRegisterSubroute:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref PatientRegisterRoute, PathPart: patient}
  DoctorRegisterSubroute:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref PatientRegisterRoute, PathPart: doctor}
  LoginResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref PatientRegisterResource, PathPart: login}
  RefreshResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref PatientRegisterResource, PathPart: refresh}
  LogoutResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref RestApi, ParentId: !Ref PatientRegisterResource, PathPart: logout}
  RegisterPatientMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref PatientRegisterSubroute
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterFunction.Arn}/invocations'}
  RegisterDoctorMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref DoctorRegisterSubroute
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DoctorRegisterFunction.Arn}/invocations'}
  LoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LoginResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginFunction.Arn}/invocations'}
  RefreshMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RefreshResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RefreshFunction.Arn}/invocations'}
  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref LogoutResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiAuthorizer
      Integration: {Type: AWS_PROXY, IntegrationHttpMethod: POST, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LogoutFunction.Arn}/invocations'}
  RegisterPatientInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref RegisterFunction, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/auth/register/patient'}
  RegisterDoctorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref DoctorRegisterFunction, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/auth/register/doctor'}
  LoginInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref LoginFunction, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/auth/login'}
  RefreshInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref RefreshFunction, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/auth/refresh'}
  LogoutInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref LogoutFunction, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/POST/auth/logout'}
  ProtectedInvokePermission:
    Type: AWS::Lambda::Permission
    Properties: {FunctionName: !Ref ProtectedFunction, Action: lambda:InvokeFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/*'}
  DoctorProfileInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DoctorProfileFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/doctor/profile*'
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - DoctorProfileDeleteMethod
      - DoctorProfilePhotoUploadMethod
      - DoctorProfileGetMethod
      - DoctorProfilePostMethod
      - DoctorProfilePutMethod
      - DoctorProfilePatchMethod
      - PatientProtectedMethod
      - DoctorProtectedMethod
      - RegisterPatientMethod
      - RegisterDoctorMethod
      - LoginMethod
      - RefreshMethod
      - LogoutMethod
    Properties:
      RestApiId: !Ref RestApi
      Description: !Sub 'MediSlot ${Environment} auth API deployment'
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false
Outputs:
  ApiUrl:
    Description: Base URL for the deployed REST API.
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
  RegisterPatientUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/auth/register/patient'
  RegisterDoctorUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/auth/register/doctor'
  LoginUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/auth/login'
  AuthorizerFunctionName: {Value: !Ref AuthorizerFunction}
  RdsConnectionCheckFunctionName: {Value: !Ref RdsConnectionCheckFunction}
